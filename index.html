<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>দোকানের ড্যাশবোর্ড (কনসেপ্ট)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#E9EEF8;font-family:'Noto Sans Bengali','Nirmala UI','Kalpurush',system-ui,sans-serif;color:#14213D}
button,input{font-family:inherit}
button{cursor:pointer}
.lift{transition:transform .15s ease,box-shadow .15s ease}
.lift:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(15,30,74,.16)}
.lift:active{transform:scale(.98)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.row{display:flex;flex-wrap:wrap;gap:14px}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(15,30,74,.08)}
.ico{flex:none;display:flex;align-items:center;justify-content:center}
.sidebrand{display:none}
.ctag{font-size:12px;color:#5C3D00;background:#FFF1D6;border-radius:6px;padding:1px 7px}
select,textarea,input{font-family:inherit}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#14213D;color:#fff;padding:12px 20px;border-radius:12px;font-size:16px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none;max-width:90vw;text-align:center}
@media (min-width:900px){
  .shell{margin-left:250px}
  .sidenav{position:fixed!important;left:0;top:0;bottom:0;width:250px;padding:22px 14px!important;background:#0F1E4A!important;z-index:6;overflow-y:auto}
  .sidebrand{display:flex;align-items:center;gap:12px;color:#fff;font-weight:700;font-size:18px;line-height:1.3;margin:0 6px 22px}
  .sidebrand img{width:52px;height:52px;border-radius:14px;background:#fff;object-fit:cover}
  .navin{flex-direction:column!important;max-width:none!important;background:transparent!important;box-shadow:none!important;padding:0!important;gap:6px!important;overflow:visible!important;margin:0!important;border-radius:0!important}
  .navbtn{flex:none!important;flex-direction:row!important;justify-content:flex-start!important;gap:14px!important;min-height:56px!important;padding:0 16px!important;font-size:17px!important;border-radius:14px!important;background:transparent!important;color:#C9D3F2!important}
  .navbtn:hover{background:#1A2C66!important;color:#fff!important}
  .navbtn.on{background:#1B44C8!important;color:#fff!important}
}
</style>
</head>

   +'<div class="card" style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;min-width:620px"><thead><tr><th style="'+th+'">কাস্টমারের নাম</th><th style="'+th+'">বিক্রি (সেট / পিছ)</th><th style="'+th+'">রিপ্লেস (সেট / পিছ)</th><th style="'+th+'">রিপ্লেস %</th></tr></thead><tbody>'
   +rows.map(function(r){return '<tr onclick="go(\'x:customerDetail\')" style="cursor:pointer;background:'+r[0]+'"><td style="'+td+';font-weight:600">নমুনা কাস্টমার '+bn(r[1])+'</td><td style="'+td+'">'+bn(r[2])+'</td><td style="'+td+'">'+bn(r[3])+'</td><td style="'+td+'">'+bn(r[4])+'%</td></tr>';}).join('')
   +'<tr style="background:#F2F5FB"><td style="'+td+';font-weight:700">মোট</td><td style="'+td+';font-weight:700">'+bn(ts)+'</td><td style="'+td+';font-weight:700">'+bn(tr)+'</td><td style="'+td+';font-weight:700">'+bn(Math.round(tr*100/ts))+'%</td></tr></tbody></table></div>'
   +'<div class="row" style="gap:10px;align-items:center;font-size:15px"><span style="background:#DCEFD2;border-radius:8px;padding:6px 14px">ভালো</span><span style="background:#FFF1B8;border-radius:8px;padding:6px 14px">মোটামুটি</span><span style="background:#F9C9C9;border-radius:8px;padding:6px 14px">খারাপ</span><span style="color:#4A5568">নমুনা নিয়ম: ১০% পর্যন্ত ভালো, ২০% পর্যন্ত মোটামুটি, এর বেশি খারাপ। আসল নিয়ম আপনি ঠিক করে দেবেন</span></div>'
   +'<div style="font-size:15px;color:#4A5568;line-height:1.6">সব নাম ও সংখ্যা নমুনা, আসল ডেটা নয়। যেকোনো সারিতে চাপলে ওই কাস্টমারের প্রতিটি বিক্রি ও রিপ্লেসের তারিখসহ বিস্তারিত দেখা যাবে।</div>';
  return s;
}

function renderPage(pg){
  if(state.page.indexOf('x:')===0) return renderScreen(state.page.slice(2));
  if(state.page==='ledger') return renderLedger(pg);
  var s = '<button class="lift" onclick="go(\'home\')" style="align-self:flex-start;min-height:48px;padding:0 20px;border:0;border-radius:12px;background:#fff;box-shadow:0 2px 10px rgba(15,30,74,.10);color:#14213D;font-size:17px;font-weight:600">← হোমে ফিরুন</button>'
    + '<div style="background:'+pg.color+';color:#fff;border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 20px rgba(15,30,74,.18)"><div style="font-size:28px;font-weight:700">'+pg.name+'</div><div style="font-size:16px;opacity:.92">'+pg.hint+'</div></div><div class="row">';
  pg.btns.forEach(function(b,i){
    var c = !!b[2];
    s += '<button class="lift" '+onc(b)+'style="flex:1 1 300px;min-height:104px;text-align:left;display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;color:#14213D;'+(c?'background:#FFFBF0;border:2px dashed #B58A2A':'background:#fff;border:0;box-shadow:0 2px 10px rgba(15,30,74,.08)')+'">'
      + '<span class="ico" style="width:44px;height:44px;border-radius:14px;font-size:20px;font-weight:700;color:'+(c?'#7A4A00':pg.color)+';background:'+(c?'#FFE2A8':pg.tint)+'">'+(i+1)+'</span>'
      + '<span style="flex:1;display:flex;flex-direction:column;gap:4px;align-items:flex-start"><span style="font-size:20px;font-weight:700">'+b[0]+'</span><span style="font-size:14px;color:#4A5568;line-height:1.5">'+b[1]+'</span>'
      + (c?'<span style="font-size:12px;background:#FFF1D6;color:#5C3D00;border-radius:6px;padding:2px 8px">কাস্টম · হেড অফিস</span>':'')+'</span>'
      + '<span style="flex:none;color:#4A5568">'+svg('chev',22,2.5)+'</span></button>';
  });
  return s + '</div>';
}
document.getElementById('sbLogo').src = document.querySelector('header img, img[alt="দোকানের লোগো"]').src;
render();
</script>
